<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GreatPhones — Chat de prueba</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #e5ddd5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .phone-frame {
      width: 100%;
      max-width: 420px;
      height: 90vh;
      max-height: 820px;
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 32px rgba(0,0,0,.25);
    }

    /* ── Header ── */
    .header {
      background: #075e54;
      color: #fff;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: #25d366;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 700; flex-shrink: 0;
    }
    .header-info { flex: 1; min-width: 0; }
    .header-name { font-weight: 600; font-size: 15px; }
    .header-status { font-size: 12px; opacity: .8; }

    /* Phone selector */
    .phone-bar {
      background: #f0f0f0;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #ddd;
      flex-shrink: 0;
    }
    .phone-bar label { font-size: 12px; color: #555; white-space: nowrap; }
    .phone-bar input {
      flex: 1;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 13px;
      outline: none;
    }
    .phone-bar input:focus { border-color: #25d366; }
    .btn-clear {
      background: none;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 11px;
      cursor: pointer;
      color: #555;
      white-space: nowrap;
    }
    .btn-clear:hover { background: #eee; }

    /* ── Chat area ── */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: #e5ddd5 url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23b0a898' fill-opacity='0.15'%3E%3Cpath d='M30 30c0-5.5-4.5-10-10-10s-10 4.5-10 10 4.5 10 10 10 10-4.5 10-10zm10 0c0-5.5-4.5-10-10-10s-10 4.5-10 10 4.5 10 10 10 10-4.5 10-10z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }

    /* ── Bubbles ── */
    .msg-row {
      display: flex;
      margin: 1px 0;
    }
    .msg-row.user { justify-content: flex-end; }
    .msg-row.agent { justify-content: flex-start; }

    .bubble {
      max-width: 78%;
      padding: 7px 10px 6px;
      border-radius: 8px;
      position: relative;
      word-wrap: break-word;
      line-height: 1.45;
      font-size: 14px;
    }

    /* Arrow nubs */
    .msg-row.user .bubble {
      background: #dcf8c6;
      border-top-right-radius: 2px;
    }
    .msg-row.user .bubble::after {
      content: '';
      position: absolute;
      top: 0; right: -7px;
      border: 7px solid transparent;
      border-top-color: #dcf8c6;
      border-right: none;
    }

    .msg-row.agent .bubble {
      background: #fff;
      border-top-left-radius: 2px;
    }
    .msg-row.agent .bubble::after {
      content: '';
      position: absolute;
      top: 0; left: -7px;
      border: 7px solid transparent;
      border-top-color: #fff;
      border-left: none;
    }

    .bubble-text { display: block; }
    .bubble-meta {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 3px;
      margin-top: 3px;
    }
    .bubble-time {
      font-size: 11px;
      color: #999;
    }
    .msg-row.user .bubble-time { color: #7bc67a; }
    .check { font-size: 11px; color: #53bdeb; }

    /* Status chips */
    .status-chip {
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 10px;
      margin-left: 4px;
      font-weight: 600;
      vertical-align: middle;
    }
    .chip-score { background: #e8f5e9; color: #2e7d32; }
    .chip-escalated { background: #fce4ec; color: #c62828; }

    /* System messages */
    .sys-msg {
      text-align: center;
      margin: 8px 0;
    }
    .sys-msg span {
      background: rgba(225,245,254,.85);
      color: #0277bd;
      font-size: 11.5px;
      padding: 3px 10px;
      border-radius: 12px;
      display: inline-block;
    }

    /* Typing indicator */
    .typing-bubble {
      background: #fff;
      border-radius: 8px;
      border-top-left-radius: 2px;
      padding: 10px 14px;
      display: flex; align-items: center; gap: 4px;
    }
    .typing-bubble span {
      width: 7px; height: 7px;
      background: #aaa;
      border-radius: 50%;
      animation: bounce .8s infinite ease-in-out;
    }
    .typing-bubble span:nth-child(2) { animation-delay: .15s; }
    .typing-bubble span:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-5px); }
    }

    /* ── Input bar ── */
    .input-bar {
      background: #f0f0f0;
      padding: 8px 10px;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      border-top: 1px solid #ddd;
      flex-shrink: 0;
    }
    .input-wrap {
      flex: 1;
      background: #fff;
      border-radius: 22px;
      border: none;
      display: flex;
      align-items: flex-end;
      padding: 8px 14px;
      min-height: 42px;
      box-shadow: 0 1px 2px rgba(0,0,0,.1);
    }
    #msg-input {
      flex: 1;
      border: none;
      outline: none;
      resize: none;
      font-size: 15px;
      max-height: 100px;
      line-height: 1.4;
      background: transparent;
      font-family: inherit;
    }
    #send-btn {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: #25d366;
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background .15s;
    }
    #send-btn:hover { background: #1da851; }
    #send-btn:disabled { background: #aaa; cursor: default; }
    #send-btn svg { fill: #fff; width: 20px; height: 20px; }

    /* Scrollbar */
    .chat-area::-webkit-scrollbar { width: 4px; }
    .chat-area::-webkit-scrollbar-thumb { background: rgba(0,0,0,.2); border-radius: 4px; }
  </style>
</head>
<body>

<div class="phone-frame">

  <!-- Header -->
  <div class="header">
    <div class="avatar">G</div>
    <div class="header-info">
      <div class="header-name">GreatPhones</div>
      <div class="header-status" id="header-status">en línea</div>
    </div>
  </div>

  <!-- Phone picker -->
  <div class="phone-bar">
    <label>📱 Teléfono:</label>
    <input type="text" id="phone-input" value="5491155550001" placeholder="5491155550001">
    <button class="btn-clear" onclick="clearChat()">Limpiar chat</button>
  </div>

  <!-- Messages -->
  <div class="chat-area" id="chat-area">
    <div class="sys-msg"><span>Hoy</span></div>
    <div class="sys-msg"><span>Conectado a localhost:3000</span></div>
  </div>

  <!-- Input -->
  <div class="input-bar">
    <div class="input-wrap">
      <textarea
        id="msg-input"
        rows="1"
        placeholder="Escribí un mensaje…"
        onkeydown="handleKey(event)"
        oninput="autoResize(this)"
      ></textarea>
    </div>
    <button id="send-btn" onclick="sendMessage()" title="Enviar">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>

</div>

<script>
  const API = 'http://localhost:3000/message';

  function now() {
    return new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
  }

  function getPhone() {
    return document.getElementById('phone-input').value.trim() || '5491155550001';
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 100) + 'px';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function scrollBottom() {
    const area = document.getElementById('chat-area');
    area.scrollTop = area.scrollHeight;
  }

  function addUserBubble(text) {
    const area = document.getElementById('chat-area');
    const row = document.createElement('div');
    row.className = 'msg-row user';
    row.innerHTML = `
      <div class="bubble">
        <span class="bubble-text">${escHtml(text)}</span>
        <div class="bubble-meta">
          <span class="bubble-time">${now()}</span>
          <span class="check">✓✓</span>
        </div>
      </div>`;
    area.appendChild(row);
    scrollBottom();
  }

  function addAgentBubble(text, score, escalated) {
    const area = document.getElementById('chat-area');
    const row = document.createElement('div');
    row.className = 'msg-row agent';
    const chips = [
      score != null ? `<span class="status-chip chip-score">score ${score}</span>` : '',
      escalated ? `<span class="status-chip chip-escalated">🚨 escalar</span>` : '',
    ].join('');
    row.innerHTML = `
      <div class="bubble">
        <span class="bubble-text">${escHtml(text)}</span>
        <div class="bubble-meta">
          ${chips}
          <span class="bubble-time">${now()}</span>
        </div>
      </div>`;
    area.appendChild(row);
    scrollBottom();
  }

  function addSysMsg(text) {
    const area = document.getElementById('chat-area');
    const d = document.createElement('div');
    d.className = 'sys-msg';
    d.innerHTML = `<span>${escHtml(text)}</span>`;
    area.appendChild(d);
    scrollBottom();
  }

  function showTyping() {
    const area = document.getElementById('chat-area');
    const row = document.createElement('div');
    row.className = 'msg-row agent';
    row.id = 'typing-row';
    row.innerHTML = `
      <div class="typing-bubble">
        <span></span><span></span><span></span>
      </div>`;
    area.appendChild(row);
    scrollBottom();
    return row;
  }

  function removeTyping() {
    const el = document.getElementById('typing-row');
    if (el) el.remove();
  }

  function setLoading(on) {
    const btn = document.getElementById('send-btn');
    const input = document.getElementById('msg-input');
    btn.disabled = on;
    input.disabled = on;
    document.getElementById('header-status').textContent = on ? 'escribiendo…' : 'en línea';
  }

  function escHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/\n/g, '<br>');
  }

  async function sendMessage() {
    const input = document.getElementById('msg-input');
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    input.style.height = 'auto';
    addUserBubble(text);
    setLoading(true);
    const typingEl = showTyping();

    try {
      const res = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: getPhone(), message: text, channel: 'web' }),
      });

      removeTyping();

      if (!res.ok) {
        const err = await res.text();
        addSysMsg(`⚠️ Error ${res.status}: ${err}`);
        return;
      }

      const json = await res.json();

      if (!json.ok || !json.data) {
        addSysMsg(`⚠️ Respuesta inesperada del servidor`);
        return;
      }

      const { respuesta, agentResponse, escalated } = json.data;
      const score = agentResponse?.lead_score ?? null;
      addAgentBubble(respuesta, score, escalated);

    } catch (err) {
      removeTyping();
      addSysMsg(`⚠️ No se pudo conectar a localhost:3000 — ¿está corriendo npm run dev?`);
    } finally {
      setLoading(false);
      document.getElementById('msg-input').focus();
    }
  }

  function clearChat() {
    const area = document.getElementById('chat-area');
    area.innerHTML = `
      <div class="sys-msg"><span>Chat limpiado — ${now()}</span></div>
      <div class="sys-msg"><span>Conectado a localhost:3000</span></div>`;
  }

  // Focus on load
  document.getElementById('msg-input').focus();
</script>
</body>
</html>
